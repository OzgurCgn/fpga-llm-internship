name: CPU and RTL verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install simulators
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: C++ arithmetic kernel tests
        run: |
          mkdir -p artifacts
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -Wno-unknown-pragmas hls/kernels.cpp tests/testbench.cpp -o artifacts/kernel_tests
          ./artifacts/kernel_tests | tee artifacts/cpp_test_results.txt
      - name: AXI4-Stream RTL simulation
        run: |
          iverilog -g2012 -s tb_stream_source -o artifacts/stream.vvp rtl/stream_source.sv rtl/tb_stream_source.sv
          (cd artifacts && vvp stream.vvp) | tee artifacts/rtl_sim_results.txt
      - name: Open-source RTL synthesis
        run: |
          yosys -Q -T -p 'read_verilog -sv rtl/stream_source.sv; hierarchy -top stream_source; proc; opt; techmap; opt; stat' | tee artifacts/yosys_report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            artifacts/*.txt
            artifacts/*.vcd
          if-no-files-found: warn
