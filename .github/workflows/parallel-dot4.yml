name: Parallel dot product RTL verification and synthesis
on:
  push:
    paths:
      - 'rtl/dot4_parallel.sv'
      - 'rtl/tb_dot4_parallel.sv'
      - '.github/workflows/parallel-dot4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rtl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus and Yosys
        run: sudo apt-get update -qq && sudo apt-get install -y iverilog yosys
      - name: Run 103 functional test vectors
        run: |
          mkdir -p artifacts
          iverilog -g2012 -s tb_dot4_parallel -o artifacts/dot4_parallel.vvp rtl/dot4_parallel.sv rtl/tb_dot4_parallel.sv
          (cd artifacts && vvp dot4_parallel.vvp) | tee artifacts/parallel_simulation.txt
          grep -q 'PASS all 103 test vectors' artifacts/parallel_simulation.txt
      - name: Yosys generic synthesis
        run: |
          yosys -Q -T -p 'read_verilog -sv rtl/dot4_parallel.sv; hierarchy -top dot4_parallel; proc; opt; techmap; opt; stat' | tee artifacts/parallel_yosys.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallel-dot4-test-evidence
          path: |
            artifacts/*.txt
            artifacts/*.vcd
          retention-days: 60
